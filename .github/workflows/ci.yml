name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '*.md']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --release -- -D warnings
      - name: Unit tests
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: nietono
          path: target/release/nietono.exe

  integration:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nietono
      - name: Install, uninstall and check real programs
        shell: pwsh
        run: tests/integration.ps1 -Exe nietono.exe
