name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/nietono.exe dist/
          $hash = (Get-FileHash dist/nietono.exe -Algorithm SHA256).Hash.ToLower()
          # LF line ending, so sha256sum -c can read it.
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", "$hash  nietono.exe`n")
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/nietono.exe dist/SHA256SUMS.txt --title "Nietono ${{ github.ref_name }}" --generate-notes
