name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/tracewipe.exe dist/
          $hash = (Get-FileHash dist/tracewipe.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  tracewipe.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/tracewipe.exe dist/SHA256SUMS.txt --title "Tracewipe ${{ github.ref_name }}" --generate-notes
