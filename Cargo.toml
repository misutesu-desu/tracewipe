[package]
name = "tracewipe"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Uninstaller for Windows that removes the traces programs leave behind"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
rayon = "1.10"
windows = { version = "0.62", features = ["ApplicationModel", "Foundation", "Foundation_Collections", "Management_Deployment"] }

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_Restore",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.34"
